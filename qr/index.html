<script>
(function(){
  if (window.firebase) return;
  const KEY = 'liveRequestsDemoDB2';
  const now = Date.now();
  const seed = () => ({
    settings: { actName: 'The Doorknobs', venue: 'Waterline Brewing', tipLink: 'https://venmo.com/' },
    songs: window.STARTER_SONGS.map(s => ({...s, active: true})).concat([{id:72,title:"Don't Stop Believin'",artist:'Journey',era:'80s',genre:'Rock',active:false}]),
    requests: {
      queue: {
        d1: { songId: 2, title: 'Dreams', artist: 'Fleetwood Mac', name: 'Sarah', ts: now - 600000 },
        d2: { songId: 2, title: 'Dreams', artist: 'Fleetwood Mac', name: 'Marcus', ts: now - 500000 },
        d3: { songId: 62, title: 'Fast Car', artist: 'Tracy Chapman', name: null, ts: now - 400000 },
        d4: { songId: 31, title: "Sweet Child O Mine", artist: "Guns N' Roses", name: 'Mike', ts: now - 300000 }
      },
      played: { '18': { songId: 18, title: 'Creep', artist: 'Radiohead', ts: now - 900000 } }
    },
    requestHistory: {
      sessions: { s1: { date: '2026-10-10', venue: 'Waterline Brewing', requestCount: 6, playedCount: 5 }, s2: { date: '2026-10-17', venue: 'Satellite Bar', requestCount: 4, playedCount: 3 } },
      requests: {
        h1:{songId:49,title:'Jolene',artist:'Dolly Parton',sessionId:'s1',name:'amy'}, h2:{songId:49,title:'Jolene',artist:'Dolly Parton',sessionId:'s2',name:'joe'},
        h3:{songId:16,title:'Valerie',artist:'Amy Winehouse',sessionId:'s1'}, h4:{songId:2,title:'Dreams',artist:'Fleetwood Mac',sessionId:'s2'},
        h5:{songId:9,title:'Tennessee Whiskey',artist:'Chris Stapleton',sessionId:'s1'}, h6:{songId:16,title:'Valerie',artist:'Amy Winehouse',sessionId:'s2'},
        h7:{songId:55,title:'Under The Bridge',artist:'Red Hot Chili Peppers',sessionId:'s1'}, h8:{songId:58,title:"Ain't No Sunshine",artist:'Bill Withers',sessionId:'s1'},
        h9:{songId:49,title:'Jolene',artist:'Dolly Parton',sessionId:'s1',name:'kate'}, h10:{songId:5,title:'Yellow',artist:'Coldplay',sessionId:'s2'}
      },
      plays: { p1:{songId:49,sessionId:'s1'}, p2:{songId:16,sessionId:'s1'} }
    }
  });
  let store;
  try { store = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  if (!store || typeof store !== 'object') store = seed();
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} };
  persist();
  window.__resetDemo = () => { try { localStorage.removeItem(KEY); } catch(e) {} location.reload(); };

  const listeners = [];
  let n = 0;
  const split = p => String(p || '').split('/').filter(Boolean);
  const getAt = p => { let o = store; for (const k of split(p)) { if (o == null || typeof o !== 'object') return null; o = o[k]; } return o === undefined ? null : o; };
  const sv = v => { if (v && typeof v === 'object') { if (v['.sv'] === 'timestamp') return Date.now(); const o = Array.isArray(v) ? [] : {}; for (const k in v) o[k] = sv(v[k]); return o; } return v; };
  const setAt = (p, v) => { const ks = split(p); if (!ks.length) { store = v || {}; return; } let o = store; for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; } const l = ks[ks.length-1]; if (v == null) delete o[l]; else o[l] = JSON.parse(JSON.stringify(v)); };
  const snap = v => ({ val: () => v == null ? null : JSON.parse(JSON.stringify(v)), exists: () => v != null });
  const fire = l => setTimeout(() => l.cb(snap(l.path === '.info/connected' ? true : getAt(l.path))), 0);
  const notify = c => { c = split(c).join('/'); listeners.forEach(l => { const p = split(l.path).join('/'); if (p === '.info/connected') return; if (!c || !p || c === p || c.startsWith(p + '/') || p.startsWith(c + '/')) fire(l); }); };
  window.addEventListener('storage', e => { if (e.key !== KEY) return; try { store = JSON.parse(e.newValue) || seed(); } catch(x) { store = seed(); } listeners.forEach(fire); });

  function Ref(p){ this.path = p || ''; this.key = split(p).slice(-1)[0] || null; }
  Ref.prototype.on = function(ev, cb){ const l = {path:this.path, cb}; listeners.push(l); fire(l); return cb; };
  Ref.prototype.off = function(){};
  Ref.prototype.once = function(){ return Promise.resolve(snap(getAt(this.path))); };
  Ref.prototype.set = function(v){ setAt(this.path, sv(v)); persist(); notify(this.path); return Promise.resolve(); };
  Ref.prototype.remove = function(){ return this.set(null); };
  Ref.prototype.update = function(o){ const b = split(this.path); Object.entries(o).forEach(([k,v]) => setAt(b.concat(split(k)).join('/'), sv(v))); persist(); notify(this.path); Object.keys(o).forEach(k => notify(b.concat(split(k)).join('/'))); return Promise.resolve(); };
  Ref.prototype.push = function(v){ const c = new Ref(split(this.path).concat(['-demo' + Date.now() + (++n)]).join('/')); if (v !== undefined) { const p = c.set(v); c.then = p.then.bind(p); } return c; };

  let user = window.__DEMO_USER || null; const cbs = [];
  const auth = {
    get currentUser(){ return user; },
    onAuthStateChanged(cb){ cbs.push(cb); setTimeout(() => cb(user), 0); return () => {}; },
    getRedirectResult(){ return Promise.resolve({user:null}); },
    signInWithPopup(){ user = {email:'you@example.com', isAnonymous:false}; cbs.forEach(c => c(user)); return Promise.resolve({user}); },
    signInWithRedirect(){ return this.signInWithPopup(); },
    signInAnonymously(){ if (!user) { user = {isAnonymous:true}; cbs.forEach(c => c(user)); } return Promise.resolve({user}); },
    signOut(){ user = null; cbs.forEach(c => c(user)); return Promise.resolve(); }
  };
  const fb = { initializeApp(){ return {}; }, auth(){ return auth; }, database(){ return { ref: p => new Ref(p) }; } };
  fb.auth.GoogleAuthProvider = function(){};
  fb.database = Object.assign(fb.database, { ServerValue: { TIMESTAMP: {'.sv':'timestamp'} } });
  window.firebase = fb;
  // The preview frame can't show confirm() dialogs; the demo uses sample data, so confirm automatically.
  window.confirm = () => true;
})();

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  color-scheme:dark;
  --bg:#000;
  --label:#fff;
  --label2:rgba(235,235,245,.62);

  --glass:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05));
  --glass-blur:blur(30px) saturate(190%);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.17),inset 0 0 0 .5px rgba(255,255,255,.1),0 14px 34px rgba(0,0,0,.5);
  --rim:linear-gradient(165deg,rgba(255,255,255,.55),rgba(255,255,255,.1) 28%,rgba(255,255,255,0) 55%,rgba(255,255,255,.16));
}
html{background:var(--bg);overscroll-behavior:none}
body{background:none;color:var(--label);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh}
/* Stage light falling into the dark room. Everything glass refracts it. */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70% 42% at 50% -8%,rgba(255,170,88,.30),transparent 70%),
             radial-gradient(55% 34% at 108% 58%,rgba(255,55,95,.17),transparent 72%),
             radial-gradient(50% 30% at -8% 96%,rgba(110,92,255,.13),transparent 72%)}

:focus-visible{outline:2px solid rgba(255,255,255,.85);outline-offset:2px}
[hidden]{display:none!important}

.btn,.chip,.req,.gate-card,.sheet,.back{position:relative;isolation:isolate}
:is(.btn,.chip,.req,.gate-card,.sheet,.back)::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--rim);pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

  -webkit-mask-image:linear-gradient(to bottom,#000 30%,transparent 100%);mask-image:linear-gradient(to bottom,#000 30%,transparent 100%);

<div class="stage">
  <div class="beam" aria-hidden="true"></div>
  <div class="pool" aria-hidden="true"></div>
  <div class="wash" aria-hidden="true"></div>

  <div class="who">
    <div class="live"><i></i>Live tonight</div>
    <h1 class="act" id="act">Live music</h1>
    <div class="venue" id="venue" hidden></div>
  </div>

  <nav class="actions">
    <a class="btn btn-spot" href="../request/index.html">
      <span><span class="l" style="display:block">Request a song</span><span class="s" style="display:block">See the set list and send one in</span></span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </a>
    <a class="btn btn-ghost" id="tip" href="#" target="_blank" rel="noopener" hidden>
      <span><span class="l" style="display:block" id="tip-label">Leave a tip</span><span class="s" style="display:block">Thanks for supporting live music</span></span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </a>
  </nav>

  <div class="foot" id="foot"></div>
</div>

<script>
const $ = id => document.getElementById(id);
$('foot').textContent = 'Requests by ' + (window.APP_NAME || 'Live Requests');

function tipLabel(url){
  if (/venmo/i.test(url)) return 'Tip with Venmo';
  if (/cash\.app|cashapp/i.test(url)) return 'Tip with Cash App';
  if (/paypal/i.test(url)) return 'Tip with PayPal';
  return 'Leave a tip';
}

if (window.isFirebaseConfigured()) {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  firebase.database().ref('settings').on('value', s => {
    const st = s.val() || {};
    $('act').textContent = st.actName || 'Live music';
    document.title = st.actName ? `${st.actName}, live tonight` : 'Live tonight';
    $('venue').textContent = st.venue ? `at ${st.venue}` : '';
    $('venue').hidden = !st.venue;
    const tip = $('tip');
    if (st.tipLink) { tip.href = st.tipLink; $('tip-label').textContent = tipLabel(st.tipLink); tip.hidden = false; }
    else tip.hidden = true;
  });
}
</script>
</body>
</html>
